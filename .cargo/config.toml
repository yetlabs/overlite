# SQLite compile options.
[env]
LIBSQLITE3_FLAGS = "SQLITE_DEFAULT_MEMSTATUS=0 SQLITE_ENABLE_MATH_FUNCTIONS SQLITE_ENABLE_OFFSET_SQL_FUNC SQLITE_LIKE_DOESNT_MATCH_BLOBS SQLITE_ENABLE_GEOPOLY SQLITE_ENABLE_DBPAGE_VTAB SQLITE_ENABLE_RBU SQLITE_ENABLE_SNAPSHOT SQLITE_ENABLE_SESSION SQLITE_ENABLE_PREUPDATE_HOOK -USQLITE_ENABLE_API_ARMOR"
