[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# A protocol converts between its integer widths on every line; the wire format
# says the sizes, and a checked cast would have nothing to do on failure.
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# SQL keywords, catalog names and Postgres functions fill the docs; backticks on
# all of them read worse.
doc_markdown = "allow"
# SQL text in raw strings: a statement gains a quote, the hashes stay.
needless_raw_string_hashes = "allow"
# Every pure function is a candidate; #[must_use] is placed by hand where dropping
# the value is a bug.
must_use_candidate = "allow"
# Parsers and wire readers name their cursors i, j, c, b.
many_single_char_names = "allow"
similar_names = "allow"
# OIDs, type codes and date constants are compared with the docs as written.
unreadable_literal = "allow"
# A regex or a const beside the one statement that uses it.
items_after_statements = "allow"
# handle_simple_query and rewrite_full are lists in a deliberate order.
too_many_lines = "allow"
# Session and connection flags are independent facts, not a state machine.
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
# String building reads better as format! than as write! with an ignored Result.
format_push_string = "allow"
assigning_clones = "allow"
# Signatures shaped by a callback: SQLite functions return Result, map_err passes
# by value, and Protocol's methods stay methods beside those that need self.
unnecessary_wraps = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
# Match tables list each case on its own line on purpose.
match_same_arms = "allow"
struct_field_names = "allow"
# Restriction lints that hold the server paths to account.
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[workspace.dependencies]
overlite-core = { path = "crates/core" }
overlite-engine = { path = "crates/engine" }
overlite-hba = { path = "crates/hba" }
overlite-postgres = { path = "crates/postgres" }

rusqlite = { version = "=0.40.2", features = ["bundled", "functions", "collation", "column_decltype", "modern_sqlite", "unlock_notify", "vtab"] }
regex = "1"
fancy-regex = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = "1"
serde_yaml = "0.9"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false }
md-5 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
ctrlc = { version = "3", features = ["termination"] }
mimalloc = { version = "0.1", default-features = false }
libc = "0.2"
log = "0.4"
postgres = "0.19"
postgres-protocol = "0.6"
serde_json = "1"
tempfile = "3"
criterion = { version = "0.5", default-features = false }
rust-stemmers = "1.2"
# Postgres' own grammar (libpg_query, C, built by cc; bindgen needs libclang).
pg_query = "18.1.0"
# pg_query's tree is protobuf; the same prost, to decode it without its summary.
prost = { version = "0.13.5", default-features = false, features = ["std"] }

[package]
name = "overlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A PostgreSQL wire-protocol server over SQLite files"

[[bin]]
name = "overlite"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
overlite-core.workspace = true
overlite-engine.workspace = true
overlite-postgres.workspace = true
chrono.workspace = true
clap.workspace = true
ctrlc.workspace = true
log.workspace = true
mimalloc.workspace = true

[dev-dependencies]
# Used by tests/wire only. The binary links none of this.
hex.workspace = true
libc.workspace = true
postgres.workspace = true
postgres-protocol.workspace = true
regex.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[[test]]
name = "wire"
path = "tests/wire/main.rs"

[profile.dev]
opt-level = 1
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
debug = 0
