name: docker

# Every push to main builds the image for both architectures, so a break in the
# Dockerfile shows up before a tag; a v* tag also publishes it to GitHub's
# container registry as ghcr.io/yetlabs/overlite.
on:
  push:
    branches: [main]
    tags: ["v*"]

# The workflow's own GITHUB_TOKEN pushes to ghcr.io: no registry secret to set up.
permissions:
  contents: read
  packages: write

jobs:
  # On main, ci.yml already runs for the same push; a tag publishes nothing
  # those checks would have caught.
  test:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    # A skipped test (a push to main) still lets the build run; a failed one does not.
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        env:
          # Annotations on the multi-arch index too, not only on each image.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/yetlabs/overlite
          # v1.2.3 publishes 1.2.3, 1.2, and latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          # The source label is what links the package to this repository on
          # GitHub, so its page shows the README and inherits the repo's access.
          labels: |
            org.opencontainers.image.source=https://github.com/yetlabs/overlite
            org.opencontainers.image.title=overlite
          annotations: |
            org.opencontainers.image.source=https://github.com/yetlabs/overlite
            org.opencontainers.image.title=overlite
      - uses: docker/build-push-action@v6
        with:
          context: .
          # No QEMU: the Dockerfile builds on the native platform with a cross
          # compiler, so arm64 costs a compile, not an emulated one.
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A multi-arch push is an index: its annotations, not the per-image
          # labels, are what ghcr.io reads for the package's source and description.
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
