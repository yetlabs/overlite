name: docker

# The Dockerfile at the root builds the image from source, for whoever builds it
# themselves; release.yml publishes the one made of the release binaries. This
# checks the Dockerfile still builds for both architectures when something it
# depends on changes.
on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, Cargo.toml, Cargo.lock, .cargo/**, rust-toolchain*, .github/workflows/docker.yml]
  pull_request:
    paths: [Dockerfile, .dockerignore, Cargo.toml, Cargo.lock, .cargo/**, rust-toolchain*, .github/workflows/docker.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          # No QEMU: the Dockerfile builds on the native platform with a cross
          # compiler, so arm64 costs a compile, not an emulated one.
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
