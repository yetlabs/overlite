name: libclang
description: >
  What pg_query's build script needs besides a C compiler: libclang, which bindgen
  loads to read libpg_query's header, and on Windows the MSVC environment in which
  both cc and that clang find the compiler, headers and libraries.

inputs:
  llvm-version:
    description: The LLVM release installed where the runner image has none for its architecture.
    default: "20.1.8"

runs:
  using: composite
  steps:
    # Ubuntu: the distribution's libclang, found by clang-sys under /usr/lib/llvm-*.
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libclang-dev

    # macOS: Xcode's libclang, which clang-sys finds through xcode-select, serves
    # both architectures. Nothing to install.

    # Windows: libclang.dll has to match the build script's architecture, since the
    # build script loads it: x64 LLVM on windows-latest (the image ships it), the
    # woa64 build of LLVM on windows-11-arm, where an x64 DLL cannot be loaded.
    # That one is downloaded once and cached, trimmed to what bindgen uses:
    # libclang.dll, clang.exe and clang's own headers (downloading and installing
    # the whole of LLVM took over a minute a run).
    - if: runner.os == 'Windows' && runner.arch == 'ARM64'
      id: llvm-cache
      uses: actions/cache@v4
      with:
        path: C:\llvm-min
        key: llvm-min-${{ inputs.llvm-version }}-${{ runner.arch }}
    - if: runner.os == 'Windows'
      shell: pwsh
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
        CACHED: ${{ steps.llvm-cache.outputs.cache-hit }}
      run: |
        $ErrorActionPreference = 'Stop'
        $preinstalled = 'C:\Program Files\LLVM\bin'
        if ($env:RUNNER_ARCH -eq 'X64' -and (Test-Path "$preinstalled\libclang.dll")) {
          $bin = $preinstalled
        } else {
          if ($env:CACHED -ne 'true') {
            $flavor = if ($env:RUNNER_ARCH -eq 'ARM64') { 'woa64' } else { 'win64' }
            $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-$flavor.exe"
            # GitHub's release CDN has answered 504 here; retry before failing.
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\llvm.exe" -MaximumRetryCount 5 -RetryIntervalSec 15
            # NSIS: /S is silent, /D the directory, last and unquoted.
            Start-Process -Wait -FilePath "$env:RUNNER_TEMP\llvm.exe" -ArgumentList '/S', '/D=C:\llvm'
            # clang finds its headers at ..\lib\clang beside its own directory.
            New-Item -ItemType Directory -Force -Path 'C:\llvm-min\bin', 'C:\llvm-min\lib' | Out-Null
            Copy-Item 'C:\llvm\bin\libclang.dll', 'C:\llvm\bin\clang.exe' 'C:\llvm-min\bin'
            Copy-Item -Recurse 'C:\llvm\lib\clang' 'C:\llvm-min\lib\clang'
          }
          $bin = 'C:\llvm-min\bin'
        }
        if (-not (Test-Path "$bin\libclang.dll")) { throw "no libclang.dll in $bin" }
        # LIBCLANG_PATH makes clang-sys look there only, so another LLVM on the
        # image cannot be picked up instead. bindgen asks the clang beside it
        # (CLANG_PATH) for its include directories, stdbool.h among them.
        "LIBCLANG_PATH=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "CLANG_PATH=$bin\clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        & "$bin\clang.exe" --version
        & "$bin\clang.exe" -print-resource-dir

    # cc runs cl.exe and bindgen's clang reads the MSVC headers: INCLUDE, LIB and
    # PATH as the Developer Command Prompt of the runner's architecture sets them.
    - if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}

    # With that environment set, rustc runs whichever link.exe comes first on
    # PATH, and a `shell: bash` step puts Git's /usr/bin first, whose link.exe is
    # the coreutils one. Name MSVC's linker outright, so every shell gets it.
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $link = (Get-Command link.exe -CommandType Application | Select-Object -First 1).Source
        if ($link -notlike '*\VC\Tools\MSVC\*') { throw "first link.exe on PATH is $link, not MSVC's" }
        $triple = if ($env:RUNNER_ARCH -eq 'ARM64') { 'AARCH64_PC_WINDOWS_MSVC' } else { 'X86_64_PC_WINDOWS_MSVC' }
        "CARGO_TARGET_${triple}_LINKER=$link" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Output "linker: $link"
